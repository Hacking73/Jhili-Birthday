<!-- =========================================
     PAGE 2 — GIFT SURPRISE
========================================= -->

<section id="page2" class="page">

    <div class="gift-page">

        <p class="small-title">
            ✨ A Little Surprise ✨
        </p>

        <h2 class="gift-title">
            I Have Something For You
        </h2>

        <p class="gift-description">
            There is a special surprise waiting
            inside this gift. ❤️
        </p>


        <!-- GIFT AREA -->

        <div
            id="giftBox"
            class="gift-box"
        >

            <div class="gift-glow"></div>

            <img
                src="images/gift.png"
                alt="Birthday Gift"
                class="gift-image"
                id="giftImage"
            >

            <div class="gift-sparkles">

                <span>✦</span>
                <span>✧</span>
                <span>✦</span>
                <span>✧</span>
                <span>✦</span>
                <span>✧</span>

            </div>

        </div>


        <p
            id="giftMessage"
            class="tap-message"
        >
            👆 Tap the gift
        </p>


        <button
            id="giftContinueBtn"
            class="open-btn gift-continue"
            type="button"
        >

            Open Surprise →

        </button>

    </div>

</section>
<!-- =========================================
     PAGE 3 — PHOTO MEMORIES
========================================= -->

<section id="page3" class="page">

    <div class="photo-page">

        <p class="small-title">
            📸 Our Beautiful Memories
        </p>

        <h2 class="photo-title">
            Every Picture Has A Story ❤️
        </h2>


        <!-- PHOTO VIEWER -->

        <div class="photo-viewer">

            <!-- Previous -->

            <button
                id="prevPhotoBtn"
                class="photo-arrow photo-prev"
                type="button"
            >
                ‹
            </button>


            <!-- Main Photo -->

            <div class="photo-slider">

                <img
                    id="memoryPhoto"
                    src="images/birthday (1).jpg"
                    alt="Birthday Memory"
                >

                <div class="photo-overlay">

                    <span id="photoNumber">
                        1 / 14
                    </span>

                </div>

            </div>


            <!-- Next -->

            <button
                id="nextPhotoBtn"
                class="photo-arrow photo-next"
                type="button"
            >
                ›
            </button>

        </div>


        <!-- Caption -->

        <p
            id="photoCaption"
            class="photo-caption"
        >
            A beautiful memory ❤️
        </p>


        <!-- Progress -->

        <div
            id="photoProgress"
            class="photo-progress"
        >

            <span></span>

        </div>


        <!-- Continue -->

        <button
            id="photoNextBtn"
            class="open-btn"
            type="button"
        >

            Continue →

        </button>

    </div>

</section>
<!-- =========================================
     PAGE 5 — MAKE A WISH
========================================= -->

<section id="page5" class="page">

    <div class="cake-page">

        <p class="small-title">
            🎂 Make A Wish
        </p>

        <h2 class="cake-title">
            Make Your Birthday Wish
        </h2>


        <!-- CANDLE DISPLAY -->

        <div
            id="candleArea"
            class="candle-area"
        >

            <!-- Candle ON -->

            <img
                id="candleOn"
                class="candle-image candle-on"
                src="images/candle-on.png"
                alt="Candle On"
            >


            <!-- Candle OFF -->

            <img
                id="candleOff"
                class="candle-image candle-off"
                src="images/candle-off.png"
                alt="Candle Off"
            >


            <!-- Glow -->

            <div
                id="candleGlow"
                class="candle-glow"
            ></div>

        </div>


        <p
            id="wishText"
            class="wish-text"
        >
            Close your eyes and make a wish... ✨
        </p>


        <button
            id="blowBtn"
            class="open-btn"
            type="button"
        >

            🕯️ Blow The Candle

        </button>

    </div>

</section>
